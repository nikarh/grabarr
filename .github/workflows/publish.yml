name: Publish

# Builds the static binary once, then: pushes the container image to ghcr.io, and signs and uploads the release files.
# Runs when a release is published (images `X.Y.Z`, `X.Y` and `latest`), and for the `latest` pre-release when the
# Latest workflow calls it (images `main` and `sha-<commit>`). Run by hand, it publishes a release's tag again.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      version-suffix:
        description: Appended to the version from Cargo.toml, e.g. -dev+abc1234
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re)publish, e.g. v0.2.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}
  TARGET: x86_64-unknown-linux-musl
  IMAGE: ghcr.io/nikarh/grabarr
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build, push the image
    # Only releases are built when published: the Latest workflow creates the `latest` pre-release once and publishes
    # it itself.
    if: >-
      github.repository_owner == 'nikarh'
      && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Check the tag matches the version
        if: startsWith(env.TAG, 'v')
        run: test "$TAG" = "v$(sed -n '/^\[package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
      - name: Install the toolchain
        run: |
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup toolchain install
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ env.TARGET }}
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: node
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('web/package-lock.json') }}
      - name: Build the static binary with the frontend embedded
        env:
          GRABARR_VERSION_SUFFIX: ${{ inputs.version-suffix }}
        run: |
          set -euo pipefail
          mise run web:build
          cargo build --locked --release --target "$TARGET"
          bin="target/$TARGET/release/grabarr"
          "$bin" --version

          mkdir -p out grabarr
          cp "$bin" "out/grabarr-$TARGET"
          cp "$bin" config.example.toml README.md LICENSE-MIT LICENSE-APACHE grabarr/
          tar -czf "out/grabarr-$TARGET.tar.gz" grabarr

          root=ci-rootfs
          mkdir -p "$root/etc/ssl/certs" "$root/config"
          install -m 755 "$bin" "$root/grabarr"
          cp /etc/ssl/certs/ca-certificates.crt "$root/etc/ssl/certs/"
          # A new named volume copies this mode, so any uid can create the database.
          mkdir -m 1777 "$root/data"
      - name: Build the image
        run: |
          docker build -f Dockerfile.ci -t grabarr:ci \
            --label "org.opencontainers.image.version=$("target/$TARGET/release/grabarr" --version | cut -d' ' -f2)" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" .
      - name: Check it runs read-only, without capabilities, as nobody
        run: |
          set -euo pipefail
          mkdir -p ci && printf '[prowlarr]\nurl = "http://127.0.0.1:9"\napi_key = "x"\n' > ci/config.toml
          docker run -d --name grabarr --read-only --cap-drop=ALL --security-opt no-new-privileges \
            -v data:/data -v "$PWD/ci/config.toml:/config/config.toml:ro" grabarr:ci
          for _ in $(seq 20); do
            if docker exec grabarr /grabarr healthcheck; then exit 0; fi
            sleep 0.5
          done
          docker logs grabarr
          exit 1
      - name: Push the image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ $TAG == latest ]]; then
            tags=(main "sha-$(git rev-parse HEAD)")
          else
            version=${TAG#v}
            tags=("$version" "${version%.*}" latest)
          fi
          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"
          for tag in "${tags[@]}"; do
            docker tag grabarr:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          {
            echo "Pushed \`$IMAGE\`: ${tags[*]}"
            echo
            echo "Digest: \`$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${tags[0]}")\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: out/*
          if-no-files-found: error
          retention-days: 3

  upload:
    name: Sign and upload
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: release
      - name: Import the signing key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Checksums and signature
        working-directory: release
        run: |
          sha256sum -- * > SHA256SUMS
          gpg --batch --yes --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          cat SHA256SUMS
      - name: Generate GitHub token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" release/* --clobber
          # Files a newer build no longer has (on `latest`, which is uploaded to again and again).
          gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
            [[ -e release/$name ]] || gh release delete-asset "$TAG" "$name" --yes
          done
