[package]
name = "grabarr"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A small web UI to search Prowlarr and grab releases to qBittorrent, with live download progress."
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/nikarh/grabarr"
readme = "README.md"
keywords = ["prowlarr", "qbittorrent", "torrent", "websocket"]
categories = ["web-programming"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws", "json", "query"] }
futures-util = "0.3.34"
pico-args = "0.5.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "form", "multipart", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
ts-rs = "12.0.1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
similar_names = "allow"
struct_field_names = "allow"
match_bool = "allow"
missing_errors_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
# Duplicate transitive versions are tracked (with reasons) in deny.toml instead.
multiple_crate_versions = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The query! macros run at compile time; an optimized build of them pays off on every check.
[profile.dev.package.sqlx-macros]
opt-level = 3

[profile.release]
strip = true
panic = "abort"
