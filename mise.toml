# Development tools and tasks. Rust itself comes from rust-toolchain.toml.
[tools]
node = "26.13.0"
git-cliff = "2.14.2"
cargo-deny = "0.20.2"
"cargo:sqlx-cli" = { version = "0.9.0", default-features = "false", features = "sqlite" }

[env]
GRABARR_DEV_DB = "{{config_root}}/dev/grabarr.db"

[tasks."web:install"]
description = "Install frontend dependencies"
dir = "web"
run = "npm ci --no-audit --no-fund"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.dev]
description = "Run the backend (with dev/config.toml) and the Vite dev server at http://localhost:5173"
depends = ["web:install"]
run = "scripts/dev.sh"

[tasks."dev:remote"]
description = "The Vite dev server at http://localhost:5173, against the grabarr at $GRABARR_REMOTE"
depends = ["web:install"]
run = '''
test -n "${GRABARR_REMOTE:-}" || { echo "Set GRABARR_REMOTE to the URL of a running grabarr" >&2; exit 1; }
npm --prefix web run dev
'''

[tasks.fmt]
description = "Format Rust and frontend code"
depends = ["web:install"]
run = ["cargo fmt --all", "npm --prefix web run format"]

[tasks.lint]
description = "rustfmt check, clippy, oxfmt check, oxlint and the TypeScript type check"
depends = ["web:install"]
run = [
  "cargo fmt --all --check",
  "cargo clippy --locked --all-targets",
  "npm --prefix web run format:check",
  "npm --prefix web run lint",
  "npm --prefix web run typecheck",
]

[tasks.test]
description = "Run the Rust tests (which also regenerate the frontend API types)"
run = "cargo test --locked"

[tasks.bindings]
description = "Regenerate web/src/api/generated from the Rust API types"
run = "cargo test --locked export_bindings"

[tasks.deny]
description = "Audit dependencies: advisories, licenses, duplicates, sources"
run = "cargo deny check"

[tasks.ci]
description = "What CI's check job runs: lint, tests, and that generated files and action pins are up to date"
depends = ["lint", "test"]
run = [
  "git diff --exit-code -- web/src/api/generated .sqlx",
  "scripts/check-actions.sh",
]

[tasks.check]
description = "Everything CI checks"
depends = ["ci", "deny"]

[tasks."web:build"]
description = "Build the frontend into web/dist (embedded by the next cargo build)"
depends = ["web:install"]
dir = "web"
run = "npm run build"

[tasks.build]
description = "Release build of the binary with the frontend embedded"
depends = ["web:build"]
run = "cargo build --locked --release"

[tasks.docker]
description = "Build the container image as grabarr:dev"
run = "{{env.CONTAINER_ENGINE | default(value='docker')}} build -t grabarr:dev ."

[tasks."db:prepare"]
description = "Refresh .sqlx/ after changing a query or migration"
run = """
set -euo pipefail
mkdir -p dev
rm -f dev/prepare.db
export DATABASE_URL="sqlite://dev/prepare.db?mode=rwc" SQLX_OFFLINE=false
sqlx migrate run
# Run the mise-installed cargo-sqlx directly: `cargo sqlx` may find another one in $CARGO_HOME/bin first.
CARGO="$(command -v cargo)" cargo-sqlx sqlx prepare -- --all-targets
"""

[tasks.changelog]
description = "Regenerate CHANGELOG.md from the commits"
run = "git cliff --offline -o CHANGELOG.md"
